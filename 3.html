function panelClose(){['drawer','info','overlay'].forEach(id=>$('#'+id).classList.remove('open'));document.body.classList.remove('panel-open');}
function openPanel(which){const el=$('#'+which),isOpen=el.classList.contains('open');panelClose();if(!isOpen){el.classList.add('open');$('#overlay').classList.add('open');el.querySelector('button').focus();}}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),1700)}
function togglePlay(){playing=!playing;$('#playBtn').innerHTML=playing?'<span class="autoplay-dot"></span>Ⅱ':'▶';$('#playBtn').setAttribute('aria-label',playing?'자동 재생 일시정지':'자동 재생');clearInterval(interval);if(playing){toast('7초 간격으로 자동 재생합니다');interval=setInterval(()=>{if(index===total-1){togglePlay();return}go(index+1)},7000)}else toast('자동 재생 중지');}
for(let i=0;i<total;i++){const b=document.createElement('button');b.className='progress-seg';b.title=`${i+1}번: ${data[i].title}`;b.setAttribute('aria-label',b.title);b.addEventListener('click',()=>go(i));$('#progress').append(b);const pick=document.createElement('button');pick.className='slidepick';pick.innerHTML=`<img src="${asset(i)}" alt="" loading="lazy"><span><small>${String(i+1).padStart(2,'0')} / ${escapeHtml(data[i].category)}</small><strong>${escapeHtml(data[i].title)}</strong></span>`;pick.addEventListener('click',()=>{go(i);panelClose()});$('#slideList').append(pick);}
$('#prevBtn').onclick=()=>go(index-1);$('#nextBtn').onclick=()=>go(index+1);$('#menuBtn').onclick=()=>openPanel('drawer');$('#infoBtn').onclick=()=>openPanel('info');$('#closeDrawer').onclick=panelClose;$('#closeInfo').onclick=panelClose;$('#overlay').onclick=panelClose;$('#playBtn').onclick=togglePlay;$('#fullBtn').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>toast('전체화면을 사용할 수 없습니다'))}else document.exitFullscreen?.()};
document.addEventListener('keydown',e=>{if(e.target.closest('a,button')&&[' ','Enter'].includes(e.key))return;if(['Escape'].includes(e.key)){panelClose();return}if($('#overlay').classList.contains('open'))return;const k=e.key;if(['ArrowRight','ArrowDown','PageDown',' '].includes(k)){e.preventDefault();go(index+1)}else if(['ArrowLeft','ArrowUp','PageUp'].includes(k)){e.preventDefault();go(index-1)}else if(k==='Home'){e.preventDefault();go(0)}else if(k==='End'){e.preventDefault();go(total-1)}else if(k.toLowerCase()==='m'){openPanel('drawer')}else if(k.toLowerCase()==='i'){openPanel('info')}else if(k.toLowerCase()==='f'){$('#fullBtn').click()}else if(k.toLowerCase()==='p'){togglePlay()}});
$('#stage').addEventListener('wheel',e=>{if($('#overlay').classList.contains('open')||Math.abs(e.deltaY)<12)return;e.preventDefault();const t=Date.now();if(t-wheelLock<750)return;wheelLock=t;go(index+(e.deltaY>0?1:-1))},{passive:false});
$('#slideFrame').addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchStart={x:t.clientX,y:t.clientY,time:Date.now()}},{passive:true});$('#slideFrame').addEventListener('touchend',e=>{if(!touchStart)return;const t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2)go(index+(dx<0?1:-1));touchStart=null},{passive:true});
window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#slide-(\d+)$/);if(m)go(Number(m[1])-1)});const m=location.hash.match(/^#slide-(\d+)$/);render(m?Number(m[1])-1:0,true);
})();
</script>
</body></html>
